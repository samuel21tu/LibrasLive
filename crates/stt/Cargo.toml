[package]
name = "libraslive-stt"
version = "0.1.0"
edition = "2021"
description = "Streaming STT with whisper-rs (whisper.cpp), local small/pt model"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisper-rs = "0.16"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }
